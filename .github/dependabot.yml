# Monthly dependency updates. Every update Dependabot finds for an ecosystem, major versions
# included, arrives in one grouped pull request, so each month shows everything at once.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
