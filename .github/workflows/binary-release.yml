name: Binary distribution
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:kotlin
      - uses: actions/upload-artifact@v4
        with:
          name: receiptscript-binaries-${{ matrix.os }}
          path: |
            artifacts/receiptscript-*-binary.zip
            artifacts/receiptscript-*-binary.zip.sha256
            artifacts/receiptscript-*.jar
