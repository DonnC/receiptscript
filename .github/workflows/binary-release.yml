name: Binary distribution
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    defaults:
      run:
        working-directory: tools
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      - run: npm run release:kotlin
      - run: npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: receiptscript-binaries-${{ matrix.os }}
          path: |
            artifacts/receiptscript-*-binary.zip
            artifacts/receiptscript-*-binary.zip.sha256
            artifacts/receiptscript-*.jar
            artifacts/*.vsix
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :testDebugUnitTest :assembleRelease :assembleDebugAndroidTest :generatePomFileForReceiptScriptPublication :example:testDebugUnitTest :example:assembleDebug
      - name: Name Android distribution files
        run: |
          version=$(node -p "require('./tools/package.json').version")
          mkdir -p artifacts
          cp "build/outputs/aar/receiptscript-$version.aar" "artifacts/receiptscript-$version.aar"
          cp build/publications/receiptScript/pom-default.xml "artifacts/receiptscript-$version.pom"
          cp example/build/outputs/apk/debug/example-debug.apk "artifacts/receiptscript-example-$version.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: receiptscript-android
          path: |
            artifacts/*.aar
            artifacts/*.apk
            artifacts/*.pom
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: receiptscript-binaries-ubuntu-latest
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: receiptscript-android
          path: release
      - name: Publish tagged release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/*.jar release/*.aar release/*.pom release/*.apk release/*.vsix release/*-binary.zip release/*.sha256 --verify-tag --title "ReceiptScript $GITHUB_REF_NAME" --generate-notes "${args[@]}"
