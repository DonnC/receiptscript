name: Binary distribution
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:kotlin
      - run: npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: receiptscript-binaries-${{ matrix.os }}
          path: |
            artifacts/receiptscript-*-binary.zip
            artifacts/receiptscript-*-binary.zip.sha256
            artifacts/receiptscript-*.jar
            artifacts/*.vsix
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: receiptscript-binaries-ubuntu-latest
          path: release
      - name: Publish tagged release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/*.jar release/*.vsix release/*-binary.zip release/*.sha256 --verify-tag --title "ReceiptScript $GITHUB_REF_NAME" --generate-notes "${args[@]}"
