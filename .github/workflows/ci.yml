name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    defaults:
      run:
        working-directory: tools
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:types
      - run: npm run check:browser
      - run: npm run check:packages
      - run: npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: receiptscript-${{ matrix.os }}-${{ matrix.node }}
          path: artifacts/*.vsix
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix tools ci
      - run: npm --prefix tools run release:kotlin
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :testDebugUnitTest :assembleRelease :assembleDebugAndroidTest :generatePomFileForReceiptScriptPublication :studio:testDebugUnitTest :studio:assembleRelease :studio:assembleDebugAndroidTest :example:testDebugUnitTest :example:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: receiptscript-android-starter
          path: |
            example/build/outputs/apk/debug/*.apk
            build/outputs/aar/*.aar
