name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  javascript:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:types
      - run: npm run check:browser
      - run: npm run check:packages
      - run: npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: receiptscript-${{ matrix.os }}-${{ matrix.node }}
          path: artifacts/*.vsix
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :kotlin:test :drivers:escpos:test :kotlin:publishToMavenLocal :drivers:escpos:publishToMavenLocal
