name: Feature request
description: Suggest a template feature, printer integration or API improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the receipt or integration you need, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For template changes, show the `.rct` you would like to write. For API changes, show the Kotlin.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
